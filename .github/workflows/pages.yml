name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Minimal at the top level. `pages: write` and `id-token: write` are what mint
# the Pages deployment token, and the ONLY job that needs them is `deploy`. The
# `build` job runs on pull_request and executes third-party code -- npm lifecycle
# scripts, the bundler, a downloaded browser -- so it gets read access and
# nothing more. Each job below widens its own permissions where it must.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # A bounded job. Run 32296685908 hung on the Playwright install for 24
    # minutes -- a step sibling labs finish in 35 seconds -- and Actions would
    # have let it sit for six hours before timing it out. Fail fast instead.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # 22, not 20. Vite 8 declares `^20.19.0 || >=22.12.0`, so a bare "20"
          # only works while setup-node happens to resolve the latest 20.x —
          # it is satisfied today and would break silently on an older 20.
          node-version: 22
      # `npm ci`, not `npm install`: the lockfile is committed, and `npm install`
      # is free to resolve newer versions inside the semver ranges, so the tree
      # the gate runs against would not be the tree the lockfile describes.
      - run: npm ci
      - run: npx tsc --noEmit
      # Unit tests: the nine NIST SP 800-38G FF1 sample vectors, the DFA
      # construction checked against the platform regex engine, rank/unrank
      # bijectivity, and the full encode/decode round trip.
      - run: npm test
      - run: npm run build
      # Cache the browser binaries: a cold install pulls ~170 MB every run.
      # Keyed on the lockfile, so a Playwright bump invalidates it and nothing
      # else does.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # NOT `--with-deps`. That flag is the only thing in this job that touches
      # apt, and it is what hung run 32296685908: apt blocking on the dpkg lock
      # behind the runner's unattended-upgrades. The ubuntu-latest image already
      # ships the system libraries Chromium needs -- and the next step proves
      # that per run rather than assuming it, so if an image ever stops shipping
      # them the failure is one clear line instead of a mysterious timeout.
      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Verify the browser launches
        run: |
          node -e "
          require('playwright-core').chromium.launch()
            .then(b => b.close())
            .then(() => console.log('chromium launches'))
            .catch(e => {
              console.error('Chromium will not launch. The runner image is missing system libraries;');
              console.error('re-add --with-deps to the install step above, or pin a container image.');
              console.error(e.message);
              process.exit(1);
            });
          "
      # The claims suite runs BEFORE the a11y gate: it is the faster of the two
      # and it is the one that catches a page printing numbers its own
      # mathematics does not support.
      - name: Claims suite (the page tells the truth)
        run: npm run test:e2e
      - name: Accessibility gate (axe-core, WCAG A/AA)
        run: npm run test:a11y
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment

  # Dependabot only. Runs after the gate above, so a bump can only merge itself
  # if this lab's own tests, build, claims suite and axe run went green on the PR.
  #
  # This job lives here, in the workflow that actually runs the gate, and not in
  # a reusable workflow: a called workflow cannot request more permission than
  # its caller grants, and `contents: write` inside one kills the whole deploy at
  # startup with nothing but "workflow file issue" to go on. `build` is the only
  # job that runs on pull_request, so `needs: build` names the entire gate.
  dependabot-auto-merge:
    needs: build
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write   # required by the deploy dispatch; without it gh workflow run 403s
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3

      # Majors are included here on purpose. `needs:` above already required the
      # whole gate -- tsc, the FF1/DFA/rank unit suites, the build, the claims
      # suite and the axe WCAG run -- and that judges a bump far better than its
      # version number does. A major that actually breaks this lab fails the gate
      # and the PR stays open for a human. What keeps majors from arriving inside
      # an unmergeable grouped PR is dependabot.yml, not this job.
      - name: Merge any bump whose gate went green
        # Retry: a sibling PR merging first moves main underneath us and GitHub
        # rejects with "Base branch was modified". That race is benign, so try
        # again rather than failing the run over it.
        run: |
          for attempt in 1 2 3; do
            if gh pr merge --squash --delete-branch "$PR_URL"; then
              exit 0
            fi
            echo "merge attempt $attempt failed; base branch may have moved - retrying"
            sleep 15
          done
          echo "::warning::gate passed but the merge did not land after 3 attempts;"
          echo "::warning::leaving this PR open - Dependabot will rebase and retry."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A merge made with GITHUB_TOKEN raises no push event -- GitHub suppresses
      # them so a workflow cannot retrigger itself -- so the `on: push` deploy
      # above never runs after an auto-merge: the bump lands on main and Pages
      # keeps serving the previous build, with no red run anywhere to say so.
      # Ask for the deploy explicitly; a workflow_dispatch through the API is not
      # suppressed. The dispatched run is this same gate-then-deploy pipeline, so
      # a bad merge still ships nothing.
      - name: Deploy the merged result
        if: success()
        run: |
          if gh pr view "$PR_URL" --json state --jq .state | grep -q MERGED; then
            gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main \
              || echo "::warning::deploy dispatch failed; run pages.yml by hand"
          fi
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
